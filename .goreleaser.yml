# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

before:
  hooks:
    - go mod tidy
    - rm -rf completions
    - mkdir completions
    - rm -rf manpages
    - mkdir manpages
    - sh -c 'go run ./cmd/soft completion "bash" >./completions/{{ .ProjectName }}.bash'
    - sh -c 'go run ./cmd/soft completion "zsh" >./completions/{{ .ProjectName }}.zsh'
    - sh -c 'go run ./cmd/soft completion "fish" >./completions/{{ .ProjectName }}.fish'
    - sh -c 'go run ./cmd/soft man | gzip -c >./manpages/{{ .ProjectName }}.1.gz'

gomod:
  proxy: true

builds:
  - binary: soft
    env:
      - CGO_ENABLED=0
    main: ./cmd/soft
    ldflags: -s -w -X main.Version=v{{ .Version }} -X main.CommitSHA={{ .Commit }} -X main.CommitDate={{ .CommitDate }}
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    goarm:
      - "7"
    ignore:
      - goos: windows
        goarch: arm64
      - goos: windows
        goarch: "386"
      - goos: windows
        goarm: "7"
      - goos: freebsd
        goarch: "386"
      - goos: freebsd
        goarch: arm

archives:
  - format_overrides:
      - goos: windows
        formats: zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    wrap_in_directory: true
    files:
      - README*
      - LICENSE*
      - manpages/*
      - completions/*

nfpms:
  - vendor: charmbracelet
    file_name_template: "{{ .ConventionalFileName }}"
    formats:
      - apk
      - deb
      - rpm
    contents:
      - src: ./completions/{{ .ProjectName }}.bash
        dst: /etc/bash_completion.d/{{ .ProjectName }}
      - src: ./completions/{{ .ProjectName }}.fish
        dst: /usr/share/fish/vendor_completions.d/{{ .ProjectName }}.fish
      - src: ./completions/{{ .ProjectName }}.zsh
        dst: /usr/share/zsh/site-functions/_{{ .ProjectName }}
      - src: ./manpages/{{ .ProjectName }}.1.gz
        dst: /usr/share/man/man1/{{ .ProjectName }}.1.gz
      - src: ./.nfpm/soft-serve.service
        dst: /usr/lib/systemd/system/soft-serve.service
      - src: ./.nfpm/soft-serve.conf
        dst: /etc/soft-serve.conf
      - src: ./.nfpm/sysusers.conf
        dst: /usr/lib/sysusers.d/soft-serve.conf
      - src: ./.nfpm/tmpfiles.conf
        dst: /usr/lib/tmpfiles.d/soft-serve.conf
    scripts:
      postinstall: ./.nfpm/postinstall.sh
      postremove: ./.nfpm/postremove.sh
    dependencies:
      - git
      - bash
    rpm:
      signature:
        key_file: '{{ if ne (index .Env "GPG_KEY_PATH") "" }}{{ .Env.GPG_KEY_PATH }}{{ else }}{{ end }}'
    deb:
      signature:
        key_file: '{{ if ne (index .Env "GPG_KEY_PATH") "" }}{{ .Env.GPG_KEY_PATH }}{{ else }}{{ end }}'

brews:
  - repository:
      owner: charmbracelet
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    dependencies:
      - name: git
      - name: bash
    install: |-
      bin.install "soft"
      bash_completion.install "completions/{{ .ProjectName }}.bash" => "{{ .ProjectName }}"
      zsh_completion.install "completions/{{ .ProjectName }}.zsh" => "_{{ .ProjectName }}"
      fish_completion.install "completions/{{ .ProjectName }}.fish"
      man1.install "manpages/{{ .ProjectName }}.1.gz"

scoops:
  - repository:
      owner: charmbracelet
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
      name: scoop-bucket
    depends:
      - git

aurs:
  - name: "{{ .ProjectName }}-bin"
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/{{ .ProjectName }}-bin.git"
    depends:
      - git
      - bash
    package: |-
      cd "${srcdir}/{{ .ProjectName }}_${pkgver}_Linux_${CARCH}"
      # bin
      install -Dm755 "./{{ .ProjectName }}" "${pkgdir}/usr/bin/{{ .ProjectName }}"
      # license
      mkdir -p "${pkgdir}/usr/share/licenses/{{ .ProjectName }}/"
      install -Dm644 ./LICENSE* "${pkgdir}/usr/share/licenses/{{ .ProjectName }}/"
      # completions
      mkdir -p "${pkgdir}/usr/share/bash-completion/completions/"
      mkdir -p "${pkgdir}/usr/share/zsh/site-functions/"
      mkdir -p "${pkgdir}/usr/share/fish/vendor_completions.d/"
      install -Dm644 "./completions/{{ .ProjectName }}.bash" "${pkgdir}/usr/share/bash-completion/completions/{{ .ProjectName }}"
      install -Dm644 "./completions/{{ .ProjectName }}.zsh" "${pkgdir}/usr/share/zsh/site-functions/_{{ .ProjectName }}"
      install -Dm644 "./completions/{{ .ProjectName }}.fish" "${pkgdir}/usr/share/fish/vendor_completions.d/{{ .ProjectName }}.fish"
      # man pages
      install -Dm644 "./manpages/{{ .ProjectName }}.1.gz" "${pkgdir}/usr/share/man/man1/{{ .ProjectName }}.1.gz"
      # readme
      mkdir -pv "${pkgdir}/usr/share/doc/{{ .ProjectName }}/"
      install -Dm644 README* "${pkgdir}/usr/share/doc/{{ .ProjectName }}/"

nix:
  - repository:
      owner: charmbracelet
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
      name: nur
    extra_install: |-
      installManPage ./manpages/{{.ProjectName}}.1.gz
      installShellCompletion ./completions/*

winget:
  - publisher: charmbracelet
    copyright: Charmbracelet, Inc
    repository:
      owner: charmbracelet
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
      name: winget-pkgs
      branch: "{{.ProjectName}}-{{.Version}}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

checksum:
  name_template: "checksums.txt"

source:
  enabled: true

sboms:
  - artifacts: archive
  - id: source
    artifacts: source

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  use: github
  format: "{{ .SHA }}: {{ .Message }} ({{ with .AuthorUsername }}@{{ . }}{{ else }}{{ .AuthorName }}{{ end }})"
  filters:
    exclude:
      - "^test:"
      - "^chore"
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
      - go mod tidy
  groups:
    - title: "Deps"
      regexp: "^.*\\(deps\\)*:+.*$"
      order: 300
    - title: "New!"
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 100
    - title: "Fixed"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 200
    - title: "Docs"
      regexp: "^.*docs[(\\w)]*:+.*$"
      order: 400
    - title: "Other stuff"
      order: 9999

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
        entitlements: '{{ envOrDefault "MACOS_SIGN_ENTITLEMENTS" "" }}'
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

dockers:
  - image_templates:
      - "{{ if not .IsNightly }}docker.io/charmcli/{{ .ProjectName }}:v{{ .Version }}-amd64{{ end }}"
      - "ghcr.io/charmbracelet/{{ .ProjectName }}:v{{ .Version }}-amd64"
    goarch: amd64
    build_flag_templates:
      - --platform=linux/amd64
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.description=A tasty, self-hostable Git server for the command line🍦
      - --label=org.opencontainers.image.source={{ .GitURL }}
      - --label=org.opencontainers.image.version=v{{ .Version }}
      - --label=org.opencontainers.image.created={{ .Date }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=MIT
    dockerfile: Dockerfile
    use: buildx
  - image_templates:
      - "{{ if not .IsNightly }}docker.io/charmcli/{{ .ProjectName }}:v{{ .Version }}-arm64{{ end }}"
      - "ghcr.io/charmbracelet/{{ .ProjectName }}:v{{ .Version }}-arm64"
    goarch: arm64
    build_flag_templates:
      - --platform=linux/arm64
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.description=A tasty, self-hostable Git server for the command line🍦
      - --label=org.opencontainers.image.source={{ .GitURL }}
      - --label=org.opencontainers.image.version=v{{ .Version }}
      - --label=org.opencontainers.image.created={{ .Date }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=MIT
    dockerfile: Dockerfile
    use: buildx
  - image_templates:
      - "{{ if not .IsNightly }}docker.io/charmcli/{{ .ProjectName }}:v{{ .Version }}-armv7{{ end }}"
      - "ghcr.io/charmbracelet/{{ .ProjectName }}:v{{ .Version }}-armv7"
    goarch: arm
    goarm: "7"
    build_flag_templates:
      - --platform=linux/arm/v7
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.description=A tasty, self-hostable Git server for the command line🍦
      - --label=org.opencontainers.image.source={{ .GitURL }}
      - --label=org.opencontainers.image.version=v{{ .Version }}
      - --label=org.opencontainers.image.created={{ .Date }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=MIT
    dockerfile: Dockerfile
    use: buildx

docker_manifests:
  - name_template: "{{ if not .IsNightly }}docker.io/charmcli/{{ .ProjectName }}:latest{{ end }}"
    image_templates:
      - "docker.io/charmcli/{{ .ProjectName }}:v{{ .Version }}-amd64"
      - "docker.io/charmcli/{{ .ProjectName }}:v{{ .Version }}-arm64"
      - "docker.io/charmcli/{{ .ProjectName }}:v{{ .Version }}-armv7"
  - name_template: "{{ if not .IsNightly }}ghcr.io/charmbracelet/{{ .ProjectName }}:latest{{ end }}"
    image_templates:
      - "ghcr.io/charmbracelet/{{ .ProjectName }}:v{{ .Version }}-amd64"
      - "ghcr.io/charmbracelet/{{ .ProjectName }}:v{{ .Version }}-arm64"
      - "ghcr.io/charmbracelet/{{ .ProjectName }}:v{{ .Version }}-armv7"
  - name_template: "{{ if not .IsNightly }}docker.io/charmcli/{{ .ProjectName }}:v{{ .Major }}.{{ .Minor }}{{ end }}"
    image_templates:
      - "docker.io/charmcli/{{ .ProjectName }}:v{{ .Version }}-amd64"
      - "docker.io/charmcli/{{ .ProjectName }}:v{{ .Version }}-arm64"
      - "docker.io/charmcli/{{ .ProjectName }}:v{{ .Version }}-armv7"
  - name_template: "{{ if not .IsNightly }}ghcr.io/charmbracelet/{{ .ProjectName }}:v{{ .Major }}.{{ .Minor }}{{ end }}"
    image_templates:
      - "ghcr.io/charmbracelet/{{ .ProjectName }}:v{{ .Version }}-amd64"
      - "ghcr.io/charmbracelet/{{ .ProjectName }}:v{{ .Version }}-arm64"
      - "ghcr.io/charmbracelet/{{ .ProjectName }}:v{{ .Version }}-armv7"
  - name_template: "{{ if not .IsNightly }}docker.io/charmcli/{{ .ProjectName }}:v{{ .Version }}{{ end }}"
    image_templates:
      - "docker.io/charmcli/{{ .ProjectName }}:v{{ .Version }}-amd64"
      - "docker.io/charmcli/{{ .ProjectName }}:v{{ .Version }}-arm64"
      - "docker.io/charmcli/{{ .ProjectName }}:v{{ .Version }}-armv7"
  - name_template: "ghcr.io/charmbracelet/{{ .ProjectName }}:v{{ .Version }}"
    image_templates:
      - "ghcr.io/charmbracelet/{{ .ProjectName }}:v{{ .Version }}-amd64"
      - "ghcr.io/charmbracelet/{{ .ProjectName }}:v{{ .Version }}-arm64"
      - "ghcr.io/charmbracelet/{{ .ProjectName }}:v{{ .Version }}-armv7"

docker_signs:
  - cmd: cosign
    artifacts: manifests
    output: true
    args:
      - "sign"
      - "${artifact}"
      - "--yes"

git:
  tag_sort: semver

release:
  prerelease: auto
