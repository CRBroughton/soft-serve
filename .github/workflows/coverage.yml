name: coverage

on:
  push:
    branches:
      - "main"
  pull_request:

jobs:
  coverage:
    strategy:
      matrix:
        os: [ubuntu-latest] # TODO: add macos & windows
    services:
      postgres:
        image: postgres
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Lint coverage script
        run: nix flake check

      - name: Test
        run: nix run .#coverage
      - uses: codecov/codecov-action@v7
        with:
          file: ./coverage.txt
